# OOS monitoring config — Polaris
# Footprint = per-SKU listing truth. A SKU is carried in every zone EXCEPT those in
# `not_listed_in`. Never derived from search. Change it only on a deliberate baseline refresh,
# and update `footprint.established` when you do.

