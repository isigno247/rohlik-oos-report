name: Probe warehouse switching (diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          RHL_EMAIL: ${{ secrets.RHL_EMAIL }}
          RHL_PASS: ${{ secrets.RHL_PASS }}
        run: python tests/probe.py
